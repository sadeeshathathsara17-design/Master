name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p app
          unzip -q project.zip -d app
          if [ ! -f app/package.json ]; then
            D=$(dirname "$(find app -name package.json -not -path '*/node_modules/*' | head -1)")
            mv "$D"/* app/ 2>/dev/null || true
          fi
          # Repo root eke icon.png thiyenawanam eka app icon eka widihata use karanawa
          if [ -f icon.png ]; then
            mkdir -p app/resources
            cp icon.png app/resources/icon.png
            echo "Custom icon.png used"
          fi
          ls app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Generate app icons
        working-directory: app
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync web files
        working-directory: app
        run: npx cap sync android

      - name: Use fixed signing key and bump version
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Fixed debug.keystore used"
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/android/app/build.gradle

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterX-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
